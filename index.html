<body>

    <div class="modal fade" id="centermodal" tabindex="-1" role="dialog" inert>
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">        
                <div class="modal-body">
                    <div class="col-12" style="display: flex; flex-direction: column; align-items: center; justify-content: center;" id="spinner">
                        <div class="spinner-border avatar-lg m-2 spinner-cargando" role="status" style="color: var(--color-primario);"></div>
                        <h4 class="spinner-cargando" id="mensajeSpinner" style="color: var(--color-primario);"></h4>    
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- Modal PDF Bootstrap (pantalla completa) -->
    <div class="modal fade" id="modalPdfBootstrap" tabindex="-1" role="dialog" style="margin-top:60px;">
        <div class="modal-dialog modal-fullscreen" role="document" style="margin-top:60px;">
            <div class="modal-content" style="background:rgba(0,0,0,0.95); border:none; ">

                <!-- Botonera flotante -->
                <div id="pdfControls"
                    style="position:fixed; top:16px; right:16px; z-index:2000; display:flex; gap:10px;">
                </div>


                <div id="pdfHintMsg"
                    style="
                        position:fixed;
                        inset:0;
                        display:none;
                        align-items:center;
                        justify-content:center;
                        z-index:1500;
                        pointer-events:none;
                        color:#fff;
                        text-align:center;
                    ">
                    <div style="max-width:420px; opacity:.85;">
                        <i class="mdi mdi-information-outline"
                        style="font-size:52px; display:block; margin-bottom:12px;"></i>

                        <p style="font-size:16px; line-height:1.4;">
                            El documento no se pudo cargar.<br>
                            Puedes <b>recargar</b> o <b>descargar</b> usando los botones
                            en la esquina superior derecha.
                        </p>
                    </div>
                </div>

                <!-- Body -->
                <div class="modal-body p-0" style="height:100vh; overflow:hidden;">
                    <div id="pdfSpinner"
                        style="
                            position:fixed;
                            inset:0;
                            background:rgba(0,0,0,0.85);
                            z-index:1500;
                            display:none;
                            align-items:center;
                            justify-content:center;
                            flex-direction:column;
                            color:#fff;
                            font-size:16px;
                        ">
                        <div class="spinner-border text-light" role="status"
                            style="width:4rem;height:4rem;">
                        </div>
                        <div style="margin-top:14px; opacity:.85">
                            Cargando documento…
                        </div>
                    </div>
                    <div id="contenidoModalPdf"
                        style="width:100%; height:100%; overflow:auto;">
                        <!-- iframe aquí -->
                    </div>
                </div>

            </div>
        </div>
    </div>




    
    
    
    




    <div id="preloader">
        <div class="sk-spinner sk-spinner-wave">
            <div class="sk-rect1"></div>
            <div class="sk-rect2"></div>
            <div class="sk-rect3"></div>
            <div class="sk-rect4"></div>
            <div class="sk-rect5"></div>
        </div>
    </div>
    <!-- End Preload -->

    <div class="layer"></div>
    <!-- Mobile menu overlay mask -->

    <!-- Header================================================== -->
    <header>
        <div id="top_line">
            <div class="container">
                <div class="row">
                    <div class="col-6">
                        <a href="#" onclick="abrirChatWhatsApp('Hola quisiera tener mas información sobre sus servicios...'); return false" style="color: inherit; text-decoration: none;">
                            <i class="fab fa-whatsapp"></i> <strong>Chat en línea</strong>
                        </a>
                    </div>
                </div><!-- End row -->
            </div><!-- End container-->
        </div><!-- End top line-->
        
        <div class="container">
            <div class="row">
                <div class="col-3" style="display:flex;align-items:center;gap:12px;">
                    <div id="logo_home">
                    	<h1><a href="#" title="Web site mkv">Marketing Vip web site</a></h1>
                    </div>
                    <!-- Logo personalizado (se muestra si hay personalizacion) -->
                    <img id="logoPersonalizadoHeader" src="" alt="Logo" 
                         style="height:30px;object-fit:contain;border-radius:2px;display:none;opacity:0;transition:opacity .4s;margin-left:auto;margin-right:4px;">
                </div>
                <nav class="col-9" >
                    <ul id="top_tools">
                        <li  id="botonCerrarSession"  style="margin-right: 15px; display: none;">
                            <a href="#" onclick="cerrarSesion(); return false;"><i class="icon-logout"></i>Logout</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div><!-- container -->
    </header><!-- End Header -->

    
    <main ng-view>
    </main>

    <!-- Audio personalizado -->
    <audio id="audioPersonalizado" loop style="display:none;"></audio>

    <!-- Modal Bienvenida Personalizada -->
    <div class="modal fade" id="modalBienvenida" tabindex="-1" role="dialog" aria-hidden="true" data-backdrop="false" style="z-index:99999;">
        <div class="modal-dialog modal-dialog-centered" role="document"
             style="max-width:460px;width:92%;margin:auto;">
            <div class="modal-content"
                 style="position:relative;background:#111;
                        border:none;
                        border-radius:24px;
                        overflow:hidden;
                        box-shadow:0 40px 100px rgba(0,0,0,0.45);
                        max-height:92dvh;display:flex;flex-direction:column;">

                <!-- Imagen de fondo dinámica -->
                <div id="modalBgImagen"
                     style="position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;"></div>
                <!-- Overlay oscuro con gradiente -->
                <div style="position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,0.65) 0%,rgba(0,0,0,0.88) 100%);z-index:1;"></div>

                <!-- Contenido (encima del overlay) -->
                <div style="position:relative;z-index:2;display:flex;flex-direction:column;max-height:92dvh;">

                    <!-- Logos -->
                    <div style="display:flex;justify-content:center;align-items:center;gap:14px;padding:20px 32px 0;flex-shrink:0;">
                        <img id="modalLogoPersonalizado" src="" alt="Logo"
                             style="height:36px;object-fit:contain;display:none;border-radius:8px;">
                        <img src="img/logo_sticky.png" alt="Marketing Vip"
                             style="height:28px;object-fit:contain;">
                    </div>

                    <!-- Saludo -->
                    <div style="text-align:center;padding:18px 24px 10px;flex-shrink:0;">
                        <h2 id="modalNombreBienvenida"
                            style="font-size:clamp(1.1rem,4vw,1.4rem);font-weight:800;color:#ffffff;margin-bottom:8px;line-height:1.3;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,0.4);"></h2>
                        <p style="color:rgba(255,255,255,0.7);font-size:clamp(0.78rem,3vw,0.85rem);margin:0;line-height:1.5;font-weight:400;">
                            Mira lo que hemos preparado especialmente para ti en este viaje ✦
                        </p>
                    </div>

                    <!-- Cuerpo con scroll -->
                    <div style="overflow-y:auto;flex:1 1 auto;min-height:0;padding:10px 20px 4px;display:flex;flex-direction:column;gap:10px;">

                        <!-- Imágenes — img1 solo como bg -->
                        <div id="modalImagenesContainer" style="display:none;">
                            <img id="modalImagen1" src="" alt="Imagen 1" style="display:none;">
                            <img id="modalImagen2" src="" alt="Imagen 2" style="display:none;">
                        </div>

                        <!-- Descripción del viaje -->
                        <div id="modalDescripcionViaje"
                             style="display:none;background:rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;border:1px solid rgba(255,255,255,0.15);backdrop-filter:blur(8px);">
                            <p id="modalDescripcionTexto"
                               style="color:rgba(255,255,255,0.88);font-size:clamp(0.78rem,3vw,0.85rem);line-height:1.75;margin:0;white-space:pre-wrap;font-weight:400;"></p>
                        </div>

                    </div>

                    <!-- Fila inferior: imagen2 izquierda + botón derecha -->
                    <div style="padding:16px 24px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;">
                        <img id="modalImagen2Thumb" src="" alt="Imagen"
                             style="display:none;width:120px;height:80px;object-fit:cover;border-radius:12px;flex-shrink:0;border:1px solid rgba(255,255,255,0.2);">
                        <div style="flex:1;text-align:right;">
                            <button onclick="$('#modalBienvenida').modal('hide')"
                                    style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);
                                           padding:12px 32px;border-radius:999px;font-weight:700;
                                           font-size:clamp(0.82rem,3vw,0.95rem);cursor:pointer;
                                           backdrop-filter:blur(10px);letter-spacing:.3px;">
                                Empecemos 🚀
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
